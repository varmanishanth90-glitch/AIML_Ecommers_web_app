<!DOCTYPE html>
<html>
<head>
    <title>Shopping Assistant Bot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <h2>🛍 Shopping Assistant Bot</h2>
        <div id="chat-box"></div>

        <!-- Comparison screen (hidden initially) -->
        <div id="comparison-box" style="display:none;">
            <h3>🔍 Product Comparison</h3>
            <div id="comparison-results"></div>
            <button onclick="closeComparison()">Close</button>
        </div>

        <div id="input-box">
            <input type="text" id="user-input" placeholder="Ask about products...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let selectedProducts = [];

        async function sendMessage() {
            let message = document.getElementById("user-input").value;
            let response = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message})
            });
            let data = await response.json();

            let chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = "";
            data.response.forEach(product => {
                chatBox.innerHTML += `
                    <div class="product">
                        <img src="${product.image_url}" width="120">
                        <p><b>${product.productDisplayname}</b></p>
                        <p>Price: ₹${product.price}</p>
                        <p>${product.baseCOlour}, ${product.gender}, ${product.season}</p>
                        <button class="compare-btn" onclick="selectProduct(${product.id})">Compare</button>
                    </div>
                `;
            });
        }

        function selectProduct(productId) {
            if (!selectedProducts.includes(productId)) {
                selectedProducts.push(productId);
            }
            if (selectedProducts.length === 2) {
                compareProducts();
            }
        }

        async function compareProducts() {
            let response = await fetch("/compare", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({products: selectedProducts})
            });
            let data = await response.json();

            document.getElementById("comparison-box").style.display = "block";
            document.getElementById("comparison-results").innerHTML = `
                <p><b>${data.comparison[0].product1}</b> vs <b>${data.comparison[0].product2}</b></p>
                <p>Price Difference: ₹${data.comparison[0].price_difference}</p>
                <p>Same Category: ${data.comparison[0].same_category}</p>
                <p>Same Colour: ${data.comparison[0].same_colour}</p>
                <p>Same Gender: ${data.comparison[0].same_gender}</p>
                <p>Season Match: ${data.comparison[0].season_match}</p>
            `;

            selectedProducts = [];
        }

        function closeComparison() {
            document.getElementById("comparison-box").style.display = "none";
        }
    </script>
</body>
</html>
