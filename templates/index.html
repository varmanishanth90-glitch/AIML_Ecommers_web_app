<!DOCTYPE html>
<html>
<head>
    <title>Shopping Assistant Bot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="filters">
        <form id="filter-form">
            Gender: <input type="text" name="gender">
            Category: <input type="text" name="masterCategory">
            Subcategory: <input type="text" name="subCategory">
            Article Type: <input type="text" name="ArticleType">
            Colour: <input type="text" name="baseCOlour">
            Season: <input type="text" name="season">
            Min Price: <input type="number" name="min_price">
            Max Price: <input type="number" name="max_price">
            <button type="submit">Apply Filters</button>
        </form>
    </div>

    <div id="product-grid" class="grid"></div>

    <div id="pagination"></div>

    <script>
        let currentPage = 1;

        async function loadProducts(page=1) {
            currentPage = page;
            const formData = new FormData(document.getElementById("filter-form"));
            const params = new URLSearchParams(formData);
            params.append("page", page);

            let response = await fetch("/products?" + params.toString());
            let data = await response.json();

            let grid = document.getElementById("product-grid");
            grid.innerHTML = "";
            data.products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image_url}" alt="${p.productDisplayname}">
                        <h4>${p.productDisplayname}</h4>
                        <p>₹${p.price}</p>
                        <p>${p.gender}, ${p.masterCategory}, ${p.subCategory}</p>
                    </div>
                `;
            });

            // Pagination
            let pagination = document.getElementById("pagination");
            pagination.innerHTML = `
                <button onclick="loadProducts(${page-1})" ${page<=1?'disabled':''}>Prev</button>
                <span>Page ${page}</span>
                <button onclick="loadProducts(${page+1})">Next</button>
            `;
        }

        document.getElementById("filter-form").addEventListener("submit", e => {
            e.preventDefault();
            loadProducts(1);
        });

        loadProducts();
    </script>
</body>
</html>
