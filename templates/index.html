<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Filters Section -->
    <div class="filters">
        <form id="filter-form">
            <select name="gender" id="gender"></select>
            <select name="masterCategory" id="masterCategory"></select>
            <select name="subCategory" id="subCategory"></select>
            <select name="ArticleType" id="ArticleType"></select>
            <select name="baseCOlour" id="baseCOlour"></select>
            <select name="season" id="season"></select>
            <label>Price Range:</label>
            <div class="price-range-container">
                <input type="range" id="min_price" name="min_price" min="0" max="100000" value="0">
                <input type="range" id="max_price" name="max_price" min="0" max="100000" value="100000">
            </div>
            <div id="price-value">₹0 - ₹100000</div>
            <button type="submit">Apply Filters</button>
        </form>
    </div>

    <div class="tryon-note">
        <strong>Try-On Guide:</strong> Select a product, click the <em>Try On</em> button, upload your reference photo in the popup, then use the scale and offset controls to preview the apparel fit.
    </div>

    <div class="top-actions">
        <button onclick="compareProducts()">Compare Selected</button>
        <button onclick="clearSelectedProducts()">Clear Selected</button>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="grid"></div>

    <!-- Pagination -->
    <div id="pagination"></div>

    <!-- Virtual Try-On Popup -->
    <div id="tryon-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <button class="modal-close" type="button" onclick="closeTryOnModal()">✕</button>
            <h3>Live Apparel Fitting</h3>
            <div class="tryon-details">
                <div class="tryon-product-card">
                    <img id="modal-product-image" src="" alt="Product image">
                    <div>
                        <h4 id="modal-product-name"></h4>
                        <p id="modal-product-price"></p>
                        <p id="modal-product-category"></p>
                        <p id="modal-product-attributes"></p>
                    </div>
                </div>
                <div class="tryon-upload-card">
                    <p>Upload a reference photo and see the selected apparel fit it in real time.</p>
                    <input type="file" id="reference-image-input" accept="image/*">
                </div>
            </div>
            <canvas id="tryon-canvas" style="display:none;"></canvas>
            <div id="tryon-controls" class="try-on-controls" style="display:none;">
                <label>Scale: <input type="range" id="tryon-scale" min="0.2" max="1.2" step="0.05" value="0.6"></label>
                <label>X Offset: <input type="range" id="tryon-offset-x" min="-200" max="200" step="5" value="0"></label>
                <label>Y Offset: <input type="range" id="tryon-offset-y" min="-200" max="200" step="5" value="0"></label>
                <button type="button" id="tryon-auto-fit">Auto Fit</button>
            </div>
        </div>
    </div>

    <!-- Comparison Screen -->
    <div id="comparison-box" style="display:none;">
        <h3>🔍 Product Comparison</h3>
        <div id="comparison-results"></div>
        <button onclick="closeComparison()">Close</button>
    </div>

    <script>
        let selectedProducts = [];
        let selectedProductsData = {};
        let productMap = {};
        let activeTryOnProductId = null;
        let currentPage = 1;
        const perPage = 16; // ✅ Match backend
        let userImage = null;
        let productOverlayImage = null;
        let tryOnScale = 0.6;
        let tryOnOffsetX = 0;
        let tryOnOffsetY = 0;

        // Load filters from backend
        async function loadFilters() {
            let response = await fetch("/filters");
            let data = await response.json();

            ["gender","masterCategory","subCategory","ArticleType","baseCOlour","season"].forEach(field => {
                let select = document.getElementById(field);
                select.innerHTML = `<option value="">All ${field}</option>`;
                data[field].forEach(val => {
                    select.innerHTML += `<option value="${val}">${val}</option>`;
                });
            });

            const minPriceInput = document.getElementById("min_price");
            const maxPriceInput = document.getElementById("max_price");
            const minPrice = Number(data.price_range.min);
            const maxPrice = Number(data.price_range.max);

            minPriceInput.min = minPrice;
            minPriceInput.max = maxPrice;
            minPriceInput.value = minPrice;
            maxPriceInput.min = minPrice;
            maxPriceInput.max = maxPrice;
            maxPriceInput.value = maxPrice;
            updatePriceValue();
        }

        function updatePriceValue() {
            const minPriceInput = document.getElementById("min_price");
            const maxPriceInput = document.getElementById("max_price");
            const priceValue = document.getElementById("price-value");
            const minPrice = Number(minPriceInput.value);
            const maxPrice = Number(maxPriceInput.value);
            priceValue.textContent = `₹${minPrice.toLocaleString()} - ₹${maxPrice.toLocaleString()}`;
        }

        // Load products with filters + pagination
        async function loadProducts(page=1) {
            currentPage = page;
            const form = document.getElementById("filter-form");
            const formData = new FormData(form);
            const params = new URLSearchParams();

            for (const [key, value] of formData.entries()) {
                if (value) {
                    params.append(key, value);
                }
            }

            const minPriceInput = document.getElementById("min_price");
            const maxPriceInput = document.getElementById("max_price");
            const minPrice = Number(minPriceInput.value);
            const maxPrice = Number(maxPriceInput.value);
            const defaultMinPrice = Number(minPriceInput.min);
            const defaultMaxPrice = Number(maxPriceInput.max);

            if (Number.isFinite(minPrice) && minPrice !== defaultMinPrice) {
                params.set("min_price", minPrice);
            }
            if (Number.isFinite(maxPrice) && maxPrice !== defaultMaxPrice) {
                params.set("max_price", maxPrice);
            }

            params.append("page", page);

            let response = await fetch("/products?" + params.toString());
            let data = await response.json();

            let grid = document.getElementById("product-grid");
            grid.innerHTML = "";
            data.products.forEach(p => {
                productMap[p.id] = p;
                grid.innerHTML += `
                    <div class="product-card">
                        <input type="checkbox" value="${p.id}" onchange="toggleProduct(this)">
                        <img src="${p.image_url}" alt="${p.productDisplayname}">
                        <h4>${p.productDisplayname}</h4>
                        <p>₹${p.price}</p>
                        <p>${p.gender}, ${p.masterCategory}, ${p.subCategory}</p>
                        <button class="try-on-card-button" type="button" onclick="openTryOnModal(${p.id})">Try On</button>
                    </div>
                `;
            });

            // Pagination controls
            let pagination = document.getElementById("pagination");
            pagination.innerHTML = `
                <button onclick="loadProducts(${page-1})" ${page<=1?'disabled':''}>Prev</button>
                <span>Page ${page}</span>
                <button onclick="loadProducts(${page+1})" ${data.products.length < perPage ? 'disabled' : ''}>Next</button>
            `;
        }

        // Handle product selection
        function toggleProduct(checkbox) {
            let productId = parseInt(checkbox.value);
            const productData = productMap[productId];

            if (checkbox.checked) {
                if (selectedProducts.length < 4) {
                    selectedProducts.push(productId);
                    selectedProductsData[productId] = productData;
                } else {
                    alert("You can select up to 4 products only.");
                    checkbox.checked = false;
                }
            } else {
                selectedProducts = selectedProducts.filter(id => id !== productId);
                delete selectedProductsData[productId];
            }
        }

        function openTryOnModal(productId) {
            const product = productMap[productId];
            if (!product) return;

            activeTryOnProductId = productId;
            document.getElementById("modal-product-image").src = product.image_url;
            document.getElementById("modal-product-name").textContent = product.productDisplayname;
            document.getElementById("modal-product-price").textContent = `Price: ₹${product.price}`;
            document.getElementById("modal-product-category").textContent = `${product.gender} · ${product.masterCategory} · ${product.subCategory}`;
            document.getElementById("modal-product-attributes").textContent = `Type: ${product.ArticleType}, Colour: ${product.baseCOlour}, Season: ${product.season}`;
            document.getElementById("reference-image-input").value = "";
            document.getElementById("tryon-canvas").style.display = "none";
            document.getElementById("tryon-controls").style.display = "none";
            userImage = null;
            productOverlayImage = null;
            tryOnScale = 0.6;
            tryOnOffsetX = 0;
            tryOnOffsetY = 0;
            document.getElementById("tryon-scale").value = tryOnScale;
            document.getElementById("tryon-offset-x").value = tryOnOffsetX;
            document.getElementById("tryon-offset-y").value = tryOnOffsetY;
            document.getElementById("tryon-modal").style.display = "flex";
        }

        function closeTryOnModal() {
            document.getElementById("tryon-modal").style.display = "none";
        }

        function drawTryOn() {
            const canvas = document.getElementById("tryon-canvas");
            if (!userImage || !productOverlayImage) {
                return;
            }

            const ctx = canvas.getContext("2d");
            canvas.width = userImage.naturalWidth;
            canvas.height = userImage.naturalHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(userImage, 0, 0, canvas.width, canvas.height);

            const baseWidth = canvas.width * 0.5;
            const overlayWidth = baseWidth * tryOnScale;
            const overlayHeight = overlayWidth * (productOverlayImage.naturalHeight / productOverlayImage.naturalWidth);
            const x = (canvas.width - overlayWidth) / 2 + tryOnOffsetX;
            const y = (canvas.height - overlayHeight) / 2 + tryOnOffsetY;

            ctx.globalAlpha = 0.8;
            ctx.drawImage(productOverlayImage, x, y, overlayWidth, overlayHeight);
            ctx.globalAlpha = 1;
        }

        function handleReferenceImageUpload(event) {
            const file = event.target.files[0];
            if (!file || !activeTryOnProductId) return;

            const url = URL.createObjectURL(file);
            userImage = new Image();
            userImage.onload = () => {
                const product = productMap[activeTryOnProductId];
                if (!product) return;

                productOverlayImage = new Image();
                productOverlayImage.crossOrigin = "anonymous";
                productOverlayImage.onload = () => {
                    document.getElementById("tryon-canvas").style.display = "block";
                    document.getElementById("tryon-controls").style.display = "flex";
                    autoFitTryOn();
                };
                productOverlayImage.src = product.image_url;
            };
            userImage.src = url;
        }

        function autoFitTryOn() {
            tryOnScale = 0.6;
            tryOnOffsetX = 0;
            tryOnOffsetY = 0;
            document.getElementById("tryon-scale").value = tryOnScale;
            document.getElementById("tryon-offset-x").value = tryOnOffsetX;
            document.getElementById("tryon-offset-y").value = tryOnOffsetY;
            drawTryOn();
        }

        function clearSelectedProducts() {
            selectedProducts = [];
            selectedProductsData = {};
            document.querySelectorAll('#product-grid input[type="checkbox"]').forEach(cb => cb.checked = false);
        }

        async function tryOnSelectedProduct() {
            const product = getTryOnProduct();
            if (!product) {
                alert("Please select a product to try on.");
                return;
            }
            if (!userImage) {
                alert("Please upload your photo first.");
                return;
            }

            productOverlayImage = new Image();
            productOverlayImage.crossOrigin = "anonymous";
            productOverlayImage.onload = () => {
                showTryOnControls();
                autoFitTryOn();
                drawTryOn();
            };
            productOverlayImage.src = product.image_url;
        }

        // Compare selected products
        async function compareProducts() {
            if (selectedProducts.length < 2) {
                alert("Please select at least 2 products.");
                return;
            }

            let response = await fetch("/compare", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({products: selectedProducts})
            });
            let data = await response.json();

            document.getElementById("comparison-box").style.display = "block";
            let resultsDiv = document.getElementById("comparison-results");
            resultsDiv.innerHTML = "";

            data.comparison.forEach(product => {
                resultsDiv.innerHTML += `
                    <div class="comparison-card">
                        <img src="${product.image_url}" alt="${product.productDisplayname}">
                        <p><b>${product.productDisplayname}</b></p>
                        <p>Price: ₹${product.price}</p>
                        <p>Category: ${product.masterCategory}</p>
                        <p>Subcategory: ${product.subCategory}</p>
                        <p>Gender: ${product.gender}</p>
                        <p>Colour: ${product.baseCOlour}</p>
                        <p>Season: ${product.season}</p>
                    </div>
                `;
            });
        }

        function closeComparison() {
            document.getElementById("comparison-box").style.display = "none";
        }

        document.getElementById("min_price").addEventListener("input", updatePriceValue);
        document.getElementById("max_price").addEventListener("input", updatePriceValue);
        document.getElementById("reference-image-input").addEventListener("change", handleReferenceImageUpload);
        document.getElementById("tryon-scale").addEventListener("input", event => {
            tryOnScale = parseFloat(event.target.value);
            drawTryOn();
        });
        document.getElementById("tryon-offset-x").addEventListener("input", event => {
            tryOnOffsetX = parseInt(event.target.value, 10);
            drawTryOn();
        });
        document.getElementById("tryon-offset-y").addEventListener("input", event => {
            tryOnOffsetY = parseInt(event.target.value, 10);
            drawTryOn();
        });
        document.getElementById("tryon-auto-fit").addEventListener("click", autoFitTryOn);

        // Initialize page
        window.onload = async () => {
            await loadFilters();
            await loadProducts(1);
        };

        // Apply filters
        document.getElementById("filter-form").addEventListener("submit", e => {
            e.preventDefault();
            loadProducts(1);
        });
    </script>
</body>
</html>
