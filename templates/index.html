<!DOCTYPE html>
<html>
<head>
    <title>Shopping Assistant Bot</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Full screen layout */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: #f4f4f4;
        }

        h2 {
            text-align: center;
            margin: 10px 0;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fff;
            border: 1px solid #ddd;
        }

        .product {
            border-bottom: 1px solid #ddd;
            padding: 10px;
        }

        #input-box {
            display: flex;
            padding: 10px;
            background: #eee;
        }

        #user-input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin-left: 10px;
            cursor: pointer;
        }

        .compare-btn {
            margin-top: 5px;
            background: #007bff;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>🛍 Shopping Assistant Bot</h2>
        <div id="chat-box"></div>

        <div id="input-box">
            <input type="text" id="user-input" placeholder="Ask about products...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let selectedProducts = [];

        async function sendMessage() {
            let message = document.getElementById("user-input").value;
            let response = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message})
            });
            let data = await response.json();

            let chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = "";
            data.response.forEach(product => {
                chatBox.innerHTML += `
                    <div class="product">
                        <img src="${product.image_url}" width="120">
                        <p><b>${product.productDisplayname}</b></p>
                        <p>Price: ₹${product.price}</p>
                        <p>${product.baseCOlour}, ${product.gender}, ${product.season}</p>
                        <button class="compare-btn" onclick="selectProduct(${product.id})">Compare</button>
                    </div>
                `;
            });
        }

        function selectProduct(productId) {
            if (!selectedProducts.includes(productId)) {
                selectedProducts.push(productId);
            }
            if (selectedProducts.length === 2) {
                compareProducts();
            }
        }

        async function compareProducts() {
            let response = await fetch("/compare", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({products: selectedProducts})
            });
            let data = await response.json();

            let chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `
                <div class="product">
                    <h3>🔍 Comparison Result</h3>
                    <p>${JSON.stringify(data.comparison)}</p>
                </div>
            `;
            selectedProducts = []; // reset after comparison
        }
    </script>
</body>
</html>
